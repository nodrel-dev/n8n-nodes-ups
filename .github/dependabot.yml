# Dependency update automation.
#
# This repo ships ZERO runtime dependencies (constitution Principle 2) — the published tarball is
# LICENSE + README + dist only — so everything below is the dev/CI toolchain. That is exactly why
# it needs watching: a toolchain advisory never reaches an end user, but it does sit in the merge
# gate, and without alerting it drifts silently (a 16-high, 11-minor drift on @n8n/node-cli went
# unnoticed for weeks before this file existed).
#
# Grouped into ONE PR per ecosystem per week, on purpose: this repo's rule is one workflow per
# concern and a red CI meaning exactly one thing. A dozen individual bump PRs each firing the full
# lint/test/build/pack gate is noise, not signal.
version: 2

updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      # Conventional commits drive release-please's changelog and version bump. Dev-dependency
      # bumps are `chore` so they never cut a release on their own; a security fix that matters
      # to users should be a hand-written `fix` commit instead.
      prefix: chore
      include: scope
    groups:
      # Minor and patch ONLY. Majors are deliberately excluded so they arrive as their own
      # PRs and can be judged one at a time. Grouping majors in produced an unmergeable blob:
      # a single PR carrying eslint 9->10, TypeScript 5->7, @types/node 22->26 and vitest 3->4
      # failed CI outright (`n8n-node lint` died with "Cannot read properties of undefined
      # (reading 'Cjs')" inside @typescript-eslint), and nothing in it could land because the
      # whole group moves together. eslint and typescript are also pinned to exact versions
      # here and peer-constrained by @n8n/node-cli, so their majors need the toolchain to move
      # first — never an automatic merge.
      dev-dependencies:
        patterns: ['*']
        update-types: ['minor', 'patch']
    ignore:
      # n8n-workflow is a PEER dependency: the installed n8n decides the real version at runtime,
      # so bumping our dev copy tracks n8n's release train rather than fixing anything for users.
      # Majors are a deliberate, tested migration — never an automated PR.
      - dependency-name: n8n-workflow
        update-types: ['version-update:semver-major']
      # eslint and typescript are pinned to EXACT versions here and peer-constrained by
      # @n8n/node-cli (which pins eslint 9.29.0). Their majors cannot land until the n8n
      # toolchain moves first — eslint 10 kills `n8n-node lint` outright with
      # "Cannot read properties of undefined (reading 'Cjs')" inside @typescript-eslint,
      # and TypeScript 7 fails the same gate. Reopening these weekly is pure noise; bump
      # them deliberately when @n8n/node-cli supports it.
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # @types/node must track the LOWEST supported runtime, not the newest release. The
      # engine floor here is Node >= 22.22 and CI pins Node 24, so @types/node 26 would
      # happily type APIs that do not exist on a supported runtime — green types, broken
      # at run time. Move this only when the Node floor moves.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope
    groups:
      # Same split as npm, and it matters more here: a major on the release action changes the
      # workflow that publishes to npm, and CI never exercises that workflow — a green check on
      # such a PR proves nothing about releasing. Majors come separately so they get read.
      github-actions:
        patterns: ['*']
        update-types: ['minor', 'patch']
    ignore:
      # The release action drives the workflow that PUBLISHES to npm, and ci.yml never
      # exercises that workflow — a green check on such a bump proves nothing about
      # releasing, while a regression breaks releases silently. gotchas §7 records how
      # sensitive this setup is to release-please config-mode changes (manifest vs
      # config-less already deadlocked a release once). Majors here are reviewed and
      # verified against an actual release, never merged on CI colour.
      - dependency-name: googleapis/release-please-action
        update-types: ['version-update:semver-major']
